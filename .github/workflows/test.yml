name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        tmux: ['3.5', '3.7c']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install tmux
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison libevent-dev libncurses-dev pkg-config
          build_dir="$(mktemp -d)"
          trap 'rm -rf -- "$build_dir"' EXIT
          curl --fail --location --retry 3 \
            "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz" \
            --output "$build_dir/tmux.tar.gz"
          tar -xzf "$build_dir/tmux.tar.gz" -C "$build_dir"
          cd "$build_dir/tmux-${TMUX_VERSION}"
          ./configure --disable-systemd
          make -j2
          sudo make install
          tmux -V
          test "$(tmux -V)" = "tmux $TMUX_VERSION"

      - name: Run tests
        run: bash tests/run.sh
